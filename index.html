<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hoshi.deco: objetos de decoración para darle personalidad a tu hogar."
    />
    <title>Hoshi.deco | Decoración con personalidad</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-logo" href="#inicio" aria-label="Hoshi.deco, ir al inicio">
          Hoshi.deco
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
          <ul>
            <li><a href="#categorias">Categorías</a></li>
            <li><a href="#catalogo">Catálogo</a></li>
            <li><a href="#sobre-hoshi">Sobre Hoshi</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="container">
          <h1 id="hero-title">Decoración con mucha personalidad</h1>
        </div>
      </section>

      <section class="categories" id="categorias" aria-labelledby="categories-title">
        <div class="container">
          <h2 id="categories-title">Categorías</h2>
        </div>
      </section>

      <section class="featured-products" aria-labelledby="featured-products-title">
        <div class="container">
          <h2 id="featured-products-title">Productos destacados</h2>
        </div>
      </section>

      <section class="quote-banner" aria-labelledby="quote-banner-title">
        <div class="container">
          <p id="quote-banner-title">Un hogar para vivirlo a todo color.</p>
        </div>
      </section>

      <section class="new-arrivals" aria-labelledby="new-arrivals-title">
        <div class="container">
          <h2 id="new-arrivals-title">Novedades</h2>
        </div>
      </section>

      <section class="catalog" id="catalogo" aria-labelledby="catalog-title">
        <div class="container">
          <h2 id="catalog-title">Catálogo</h2>
        </div>
      </section>

      <section class="about" id="sobre-hoshi" aria-labelledby="about-title">
        <div class="container">
          <h2 id="about-title">Sobre Hoshi</h2>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Hoshi.deco</p>
      </div>
    </footer>
  </body>
</html>
